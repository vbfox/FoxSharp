name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      PAKET_SKIP_RESTORE_TARGETS: true
    steps:
    - uses: actions/checkout@v2
    - name: Install legacy libssl (required by netcoreapp2.0 test runtime)
      run: |
        wget -q http://launchpadlibrarian.net/555132422/libssl1.0.0_1.0.2n-1ubuntu5.7_amd64.deb
        sudo dpkg -i libssl1.0.0_1.0.2n-1ubuntu5.7_amd64.deb
        rm libssl1.0.0_1.0.2n-1ubuntu5.7_amd64.deb
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          2
          10
    - name: Restore packages
      run: ./paket.sh restore
    - name: Compile build script
      run: dotnet build src/BlackFox.FoxSharp.Build/BlackFox.FoxSharp.Build.fsproj
    - name: Build
      run: ./build.sh CI
  windows:
    runs-on: windows-latest
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      PAKET_SKIP_RESTORE_TARGETS: true
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          2
          10
    - name: Restore packages
      run: ./paket.cmd restore
    - name: Compile build script
      run: dotnet build src/BlackFox.FoxSharp.Build/BlackFox.FoxSharp.Build.fsproj
    - name: Build
      run: ./build.cmd CI
